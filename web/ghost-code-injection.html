<!--
  Run tools/ghost_code_injection.py to fill in ACCOUNT_URL and copy the
  result, then paste into Ghost Admin > Settings > Code injection > Site
  header.

  Sends Ghost's own "Sign in" / "Subscribe" / "Account" (Portal) buttons and
  #/portal/ links to the Firebase-backed account page instead, so website
  sign-ups use the same user base as the app and members manage their name,
  newsletters and password in one place. Portal's sign-out route is left
  alone so it still ends the Ghost session.
-->
<script>
  (function () {
    var ACCOUNT_URL = "__ACCOUNT_URL__";
    function go(mode) {
      var url = new URL(ACCOUNT_URL);
      url.searchParams.set("mode", mode);
      url.searchParams.set("r", location.pathname + location.search);
      location.href = url.toString();
    }
    function modeFor(value) {
      if (value === "signin") return "signin";
      if (value === "" || value === "signup" || value.indexOf("signup/") === 0) return "signup";
      if (value === "account" || value.indexOf("account/") === 0) return "account";
      return null; // signout, support, etc. stay with Portal
    }
    document.addEventListener(
      "click",
      function (event) {
        var el = event.target.closest && event.target.closest("[data-portal], a[href*='#/portal']");
        if (!el) return;
        var value = el.hasAttribute("data-portal")
          ? el.getAttribute("data-portal")
          : (el.getAttribute("href").split("#/portal/")[1] || "");
        var mode = modeFor(value);
        if (!mode) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        go(mode);
      },
      true
    );
    function modeForHash(hash) {
      return hash.indexOf("#/portal/") === 0 ? modeFor(hash.slice("#/portal/".length)) : null;
    }
    var hash = location.hash;
    if (hash.indexOf("#/portal/signout") === 0) {
      // The account page sends people here to end the Ghost session. Doing
      // it ourselves (the same call Portal makes) and reloading without the
      // hash keeps Portal from showing its own sign-in form afterwards.
      fetch("/members/api/session", { method: "DELETE", credentials: "same-origin" }).finally(
        function () {
          location.replace(location.pathname + location.search);
        }
      );
      return;
    }
    var onLoad = modeForHash(hash);
    if (onLoad) go(onLoad);
    // Portal also moves between its screens by changing the hash; send its
    // sign-in, sign-up and account routes to the account page too.
    window.addEventListener("hashchange", function () {
      var mode = modeForHash(location.hash);
      if (mode) go(mode);
    });
  })();
</script>
