# Builds the signed Android app bundle for Google Play when a release is
# published (pre-releases are skipped), or by hand from the Actions tab.
# The upload key lives in the production environment's secrets (see
# APP_STORES.md, "Android: Google Play"): the keystore as base64 and its
# passwords. Nothing is uploaded to Play; the bundle is attached to the
# release (and kept as a run artifact) for the Play Console upload.
#
# Release builds always sign in to the production Firebase project
# (lib/main.dart), so there is one key and one environment.
#
# Secrets (production environment, set by hand):
#   ANDROID_UPLOAD_KEYSTORE        the upload keystore, base64-encoded
#   ANDROID_UPLOAD_STORE_PASSWORD  its store password
#   ANDROID_UPLOAD_KEY_PASSWORD    the key's password
#   SHOPIFY_STOREFRONT_TOKEN       the store's Storefront access token (shared
#                                  with the website build)
# Variables:
#   SHOPIFY_STORE_DOMAIN           host the Store tab calls the Storefront API on
#   ANDROID_UPLOAD_KEY_ALIAS       (optional) key alias; default `upload`
name: Build Android release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # to attach the bundle to the release

jobs:
  bundle:
    name: Build the app bundle
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'upload' }}
        # The keystore and key.properties are written outside the checkout
        # and inside it respectively; both vanish with the runner.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE is not set on the production environment"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Write the build settings
        # The same values config/local.json holds on a developer's machine
        # (config/local.example.json).
        run: |
          printf '{"SHOPIFY_STORE_DOMAIN": "%s", "SHOPIFY_STOREFRONT_TOKEN": "%s"}\n' \
            "${{ vars.SHOPIFY_STORE_DOMAIN }}" "${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}" > config/release.json

      - name: Build
        run: flutter pub get && flutter build appbundle --dart-define-from-file=config/release.json

      - name: Name the bundle after the version
        id: bundle
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr '+' '-')
          name="bikes_pizza-${version}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.name }}
          retention-days: 30

      - name: Attach the bundle to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.bundle.outputs.name }}" --clobber
