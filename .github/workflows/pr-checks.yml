# Runs the same checks used during local development on every pull request.
# Release-oriented workflows (builds, store uploads) will live in separate files.
#
# Each check runs only when the files it covers changed (the `changes` job
# works that out from the pull request's diff), so a docs-only PR finishes
# in seconds while a change to shared code still runs everything that
# depends on it. A skipped check counts as passing. Editing this workflow,
# or running it by hand, runs every check.
name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
      functions: ${{ steps.filter.outputs.functions == 'true' || github.event_name == 'workflow_dispatch' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' }}
      site: ${{ steps.filter.outputs.site == 'true' || github.event_name == 'workflow_dispatch' }}
      config: ${{ steps.filter.outputs.config == 'true' || github.event_name == 'workflow_dispatch' }}
      contract: ${{ steps.filter.outputs.contract == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        # Compares the pull request against its base through the API (no
        # checkout needed). A manual run has no diff and runs everything.
        if: ${{ github.event_name == 'pull_request' }}
        with:
          # Files that feed more than one check are listed under each: the
          # contract's generated copies belong to their consumers too, and
          # the account page is copied into the site.
          filters: |
            workflow: &workflow
              - .github/workflows/pr-checks.yml
            app:
              - *workflow
              - contract/**
              - lib/**
              - test/**
              - assets/**
              - pubspec.yaml
              - pubspec.lock
              - analysis_options.yaml
            functions:
              - *workflow
              - contract/**
              - functions/**
            infra:
              - *workflow
              - infra/**
            site:
              - *workflow
              - site/**
              - web/public/**
            contract:
              - *workflow
              - contract/**
              - tool/contract/**
              - functions/contract.js
              - lib/contract.dart
              - site/src/lib/contract.ts
            config:
              - *workflow
              - web/**
              - firebase.json
              - .firebaserc
              - firestore.rules
              - firestore.indexes.json
              - storage.rules

  test:
    name: Analyze and test
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  functions:
    name: Cloud Functions tests
    needs: changes
    if: ${{ needs.changes.outputs.functions == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  infra:
    name: Infrastructure typecheck
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  site:
    name: Website build
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

  contract:
    name: Contract is generated
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The generated copies of contract/*.json must be committed with it.
      - name: Check the generated files are current
        run: node tool/contract/generate.mjs --check

  config:
    name: Web pages and Firebase config
    needs: changes
    if: ${{ needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The static pages have no build step, so at least make sure they
      # parse; the Firebase config files must be valid JSON.
      - name: Check the pages parse
        run: |
          for f in web/*/*.js; do node --check "$f"; done

      - name: Check the config files parse
        run: |
          for f in firebase.json .firebaserc firestore.indexes.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" && echo "$f ok"
          done
