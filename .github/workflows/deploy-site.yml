# Rebuilds the website from Sanity when content changes: the Sanity webhook
# and the scheduled functions (functions/rebuild.js) send a
# `repository_dispatch` of type `sanity-content-changed` (see
# docs/firebase.md), or it is started by hand. A dispatch whose payload
# names an `environment` rebuilds only that one; without it, both. Production is rebuilt from the latest release, so
# a content change never ships unreleased code; development is rebuilt from
# main. Only the home Hosting target is deployed; code changes reach
# production with the release deploy (deploy-firebase.yml).
name: Rebuild website

on:
  repository_dispatch:
    types: [sanity-content-changed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to mint the OIDC token for Google Cloud

jobs:
  release:
    name: Find the latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The newest published release that is neither a draft nor a
        # pre-release. When there is none the production site is not
        # rebuilt: production only ever runs released code, so publish a
        # release first.
        run: |
          if tag=$(gh release view --json tagName --jq .tagName 2>/dev/null) && [ -n "$tag" ]; then
            echo "Latest release: $tag"
          else
            tag=""
            echo "::warning::No published release yet; the production site is not rebuilt until one exists."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  production:
    needs: release
    if: ${{ needs.release.outputs.tag != '' && (github.event_name != 'repository_dispatch' || !github.event.client_payload.environment || github.event.client_payload.environment == 'production') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ needs.release.outputs.tag }}
      only: hosting:home

  development:
    if: ${{ github.event_name != 'repository_dispatch' || !github.event.client_payload.environment || github.event.client_payload.environment == 'development' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      ref: main
      only: hosting:home
