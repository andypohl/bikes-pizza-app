# Rebuilds the website from Sanity when content changes (a webhook sends a
# `repository_dispatch` of type `sanity-content-changed`; see docs/firebase.md)
# or when started by hand. Production is rebuilt from the latest release, so
# a content change never ships unreleased code; development is rebuilt from
# main. Only the home Hosting target is deployed; code changes reach
# production with the release deploy (deploy-firebase.yml).
name: Rebuild website

on:
  repository_dispatch:
    types: [sanity-content-changed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to mint the OIDC token for Google Cloud

jobs:
  release:
    name: Find the latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        # `releases/latest` is the newest published release that is neither a
        # draft nor a pre-release; 404 means there has been no release yet.
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${tag:-none}"

  production:
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ needs.release.outputs.tag }}
      only: hosting:home

  development:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      ref: main
      only: hosting:home
