# Deploys the Cloud Functions, the Hosting sites, the Firestore and Storage
# rules, and the production Sanity Studio and Post details app when a GitHub
# release is published (pre-releases are skipped). Can also be run by hand from the
# Actions tab. The steps live in deploy.yml; merges to main go to the
# development project instead (deploy-dev.yml).
name: Deploy to production

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to mint the OIDC token for Google Cloud

jobs:
  production:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      sanity: true
