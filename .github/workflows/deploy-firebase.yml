# Deploys the Cloud Functions in functions/, the account page in web/, and
# the Firestore rules to Firebase when a GitHub release is published
# (pre-releases are skipped). Can also be run by hand from the
# Actions tab.
#
# Authentication is keyless: GitHub's OIDC token is exchanged for the deploy
# service account through Workload Identity Federation (see docs/firebase.md).
#
# Required repository variables (none are secrets):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/
#                                   workloadIdentityPools/<pool>/providers/<id>
#   GCP_DEPLOY_SERVICE_ACCOUNT      deploy service account email
#   GHOST_ADMIN_API_URL             Ghost API URL for functions/.env
#   MAILGUN_DOMAIN                  (optional) Mailgun sending domain
#   MAILGUN_API_BASE                (optional) Mailgun API base, EU accounts only
#   SUBMISSION_NOTIFY_EMAIL         (optional) who to email about submissions
#   SUBMISSION_AUTHOR_EMAIL         (optional) Ghost staff account for drafts
#   SUBMISSION_FROM_EMAIL           (optional) sender address for the email
#   REVIEW_PAGE_URL                 (optional) link in the notification email
name: Deploy to Firebase

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # needed to mint the OIDC token for Google Cloud

jobs:
  deploy:
    name: Deploy to Firebase
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Write functions/.env
        run: |
          test -n "${{ vars.GHOST_ADMIN_API_URL }}" || { echo "GHOST_ADMIN_API_URL variable is not set"; exit 1; }
          echo "GHOST_ADMIN_API_URL=${{ vars.GHOST_ADMIN_API_URL }}" > .env
          echo "MAILGUN_DOMAIN=${{ vars.MAILGUN_DOMAIN }}" >> .env
          echo "MAILGUN_API_BASE=${{ vars.MAILGUN_API_BASE || 'https://api.mailgun.net' }}" >> .env
          echo "SUBMISSION_NOTIFY_EMAIL=${{ vars.SUBMISSION_NOTIFY_EMAIL }}" >> .env
          echo "SUBMISSION_AUTHOR_EMAIL=${{ vars.SUBMISSION_AUTHOR_EMAIL }}" >> .env
          echo "SUBMISSION_FROM_EMAIL=${{ vars.SUBMISSION_FROM_EMAIL }}" >> .env
          echo "REVIEW_PAGE_URL=${{ vars.REVIEW_PAGE_URL }}" >> .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          # Minting a token here verifies impersonation up front, so a
          # permissions problem fails this step with a clear message instead
          # of a generic "Failed to authenticate" from the Firebase CLI.
          token_format: access_token

      - name: Deploy
        # --force skips the interactive confirmation for deleting functions
        # that were removed from the source.
        run: npx --yes firebase-tools@15 deploy --only functions,hosting,firestore,storage --non-interactive --force
        working-directory: .
