# Deploys the Cloud Functions in functions/ when a GitHub release is
# published (pre-releases are skipped). Can also be run by hand from the
# Actions tab.
#
# Required repository configuration:
#   secret   FIREBASE_SERVICE_ACCOUNT  JSON key for a deploy-only service
#                                      account (see docs/firebase.md)
#   variable GHOST_ADMIN_API_URL       Ghost API URL for functions/.env
name: Deploy functions

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Write functions/.env
        run: |
          test -n "${{ vars.GHOST_ADMIN_API_URL }}" || { echo "GHOST_ADMIN_API_URL variable is not set"; exit 1; }
          echo "GHOST_ADMIN_API_URL=${{ vars.GHOST_ADMIN_API_URL }}" > .env

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        # --force skips the interactive confirmation for deleting functions
        # that were removed from the source.
        run: npx --yes firebase-tools@15 deploy --only functions --non-interactive --force
        working-directory: .
